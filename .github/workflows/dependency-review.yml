name: Dependency review

# Blocks pull requests that introduce a dependency with a known high or critical
# vulnerability. Two complementary checks:
#
# 1. dependency-review-action — gates on the *diff* of the GitHub dependency
#    graph (all ecosystems). Vulnerabilities already present on the base branch
#    are tracked as Dependabot alerts and do not fail unrelated PRs. The static
#    NuGet graph only sees direct references, so it cannot catch transitive
#    NuGet packages.
# 2. NuGet transitive audit — restores the solution and docs/examples and runs
#    `dotnet list package --vulnerable --include-transitive`, failing on any
#    high/critical advisory in the fully resolved graph (direct + transitive).
#    The base branch is kept clean by this same gate, so any finding here was
#    introduced by the PR (or is a newly published advisory that must be fixed).

on:
  pull_request:
    branches:
      - main
      - 'stable/**'

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    env:
      # Only high/critical advisories should fail; with TreatWarningsAsErrors,
      # default (low) NuGet audit level would fail restore on lesser advisories.
      NuGetAuditLevel: high
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # `unknown` ensures dependencies GitHub cannot classify are still evaluated.
          fail-on-scopes: runtime, development, unknown

      # Both audits run in this single job so the one required status check
      # (`dependency-review`) blocks merge when either fails.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore Camunda.Orchestration.Sdk.sln -p:NuGetAuditLevel=high
          dotnet restore docs/examples/Examples.csproj -p:NuGetAuditLevel=high

      - name: Audit resolved NuGet graph (direct + transitive)
        run: |
          set -euo pipefail
          dotnet list Camunda.Orchestration.Sdk.sln package --vulnerable --include-transitive --no-restore --format json > vuln-sln.json
          dotnet list docs/examples/Examples.csproj package --vulnerable --include-transitive --no-restore --format json > vuln-examples.json
          jq -rs '
            [.[].projects[]
              | .path as $p
              | (.frameworks // [])[]
              | ((.topLevelPackages // []) + (.transitivePackages // []))[]
              | .id as $id | .resolvedVersion as $v
              | (.vulnerabilities // [])[]
              | select(.severity == "High" or .severity == "Critical")
              | "\($p): \($id) \($v) — \(.severity) \(.advisoryurl)"]
            | unique | .[]' vuln-sln.json vuln-examples.json > high.txt
          if [ -s high.txt ]; then
            echo "::error::High/critical NuGet vulnerabilities found in resolved dependency graph:"
            cat high.txt
            exit 1
          fi
          echo "No high/critical NuGet vulnerabilities (direct or transitive)."
