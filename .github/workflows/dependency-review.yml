name: Dependency review

# Blocks pull requests that introduce a dependency with a known high or critical
# vulnerability (runtime, development, or unclassified scope). Uses the GitHub
# dependency graph, so it covers every ecosystem the graph tracks without
# language-specific tooling.
#
# It gates on the *diff*: vulnerabilities already present on the base branch are
# tracked as Dependabot alerts and do not fail unrelated PRs.

# `pull_request_target` runs this workflow from the *base* branch, so a PR cannot
# neuter the gate by editing this file. Safe because no PR code is checked out or
# executed: the action only compares the dependency graph via the GitHub API.
# Do NOT add actions/checkout of the PR head here.
on:
  pull_request_target:
    # `edited` fires when a PR is retargeted onto a protected base branch.
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - 'stable/**'

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          show-openssf-scorecard: false
