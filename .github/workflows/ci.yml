name: PR & Branch CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      - 'stable/**'
  workflow_dispatch:
    inputs:
      spec_ref:
        description: 'Git ref (branch/tag/SHA) in camunda/camunda to fetch spec from'
        required: false
        default: 'stable/8.9'

env:
  SPEC_REF: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'stable/8.9' }}

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    uses: camunda/sdk-infra/.github/workflows/sdk-commitlint.yml@v1

  breaking-change-guard:
    if: github.event_name == 'pull_request'
    uses: camunda/sdk-infra/.github/workflows/sdk-breaking-change-guard.yml@v1

  spec-ref-guard:
    uses: camunda/sdk-infra/.github/workflows/sdk-spec-ref-guard.yml@v1
    with:
      spec-ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'stable/8.9' }}
      default-ref: 'stable/8.9'
      ack: ${{ vars.SPEC_REF_OVERRIDE_ACK || '' }}
      expires: ${{ vars.SPEC_REF_OVERRIDE_EXPIRES || '' }}

  # Fails when the SDK would break existing customer code compiled against the last
  # published stable release of this major (see scripts/check-api-compat.sh). An
  # intentional break is recorded in CompatibilitySuppressions.<baseline>.xml, and adding
  # or changing one needs the `breaking-change-approved` label. On main the check skips
  # until the major has a stable release.
  api-compat:
    needs: [spec-ref-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require approval for new API break suppressions
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Deleting a suppression file approves nothing, so it needs no label.
          changed=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" -- 'src/Camunda.Orchestration.Sdk/CompatibilitySuppressions*.xml')
          if [ -z "$changed" ]; then
            echo "No suppression file added or changed."
            exit 0
          fi
          # Query labels live so adding the label and re-running the job is enough.
          labels=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" --jq '.[].name')
          if echo "$labels" | grep -qxF 'breaking-change-approved'; then
            echo "Suppression files changed and the PR has the 'breaking-change-approved' label: $changed"
            exit 0
          fi
          echo "::error::This PR adds or changes $changed, which approves a breaking API change. Add the 'breaking-change-approved' label if the break is intended."
          exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch & Bundle spec
        run: bash scripts/bundle-spec.sh

      - name: Generate SDK
        run: dotnet run --project src/Camunda.Orchestration.Sdk.Generator

      - name: Format Generated Code
        run: dotnet format src/Camunda.Orchestration.Sdk/Camunda.Orchestration.Sdk.csproj

      - name: Check API compatibility with the last stable release
        run: bash scripts/check-api-compat.sh

  test:
    needs: [spec-ref-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        stack: [simple, full]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch & Bundle spec
        run: bash scripts/bundle-spec.sh

      - name: Generate SDK
        run: dotnet run --project src/Camunda.Orchestration.Sdk.Generator

      - name: Format Generated Code
        run: dotnet format src/Camunda.Orchestration.Sdk/Camunda.Orchestration.Sdk.csproj --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Build Examples
        run: dotnet build docs/examples/Examples.csproj --configuration Release

      - name: Check README Snippets
        run: python3 scripts/sync-readme-snippets.py --check

      - name: Check SDK Example Coverage
        run: node scripts/check-example-coverage.js

      - name: Check Overwrite Completeness
        run: node scripts/check-overwrite-completeness.js

      - name: Check docs links
        run: python3 scripts/generate-docusaurus-md.py --readme-only --validate-links

      - name: Lint Check
        run: dotnet format --verify-no-changes

      - name: Detect Generation Drift (non-blocking)
        id: drift
        run: |
          if ! git diff --quiet; then
            echo 'drift=true' >> $GITHUB_OUTPUT
            echo 'Generation produced changes (reporting only).' >&2
            git diff --name-only | sed 's/^/CHANGED: /'
            git diff > _gen-drift.patch || true
          else
            echo 'drift=false' >> $GITHUB_OUTPUT
          fi

      - name: Upload Drift Patch
        if: steps.drift.outputs.drift == 'true' && matrix.stack == 'simple'
        uses: actions/upload-artifact@v7
        with:
          name: generation-drift
          path: _gen-drift.patch

      - name: Unit Tests
        run: dotnet test test/Camunda.Orchestration.Sdk.Tests --configuration Release --no-build --verbosity normal

      - name: Start Integration Stack
        working-directory: docker
        run: |
          if [ "${{ matrix.stack }}" == "full" ]; then
            docker compose -f docker-compose-full.yaml up -d
          else
            docker compose -f docker-compose.yaml up -d
          fi

      - name: Wait for Services Healthy
        run: |
          set -e
          attempts=0
          max_attempts=60
          while [ $attempts -lt $max_attempts ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9600/actuator/health/status || true)
            [ "$code" = "200" ] && echo "Broker healthy" && break
            attempts=$((attempts+1))
            sleep 5
          done
          [ $attempts -ge $max_attempts ] && echo "Broker not healthy" && exit 1 || true

      - name: Integration Tests
        run: dotnet test test/Camunda.Orchestration.Sdk.IntegrationTests --configuration Release --no-build --verbosity normal

      - name: Capture Docker Logs (always)
        if: always()
        run: |
          mkdir -p _logs
          COMPOSE_FILE="docker/docker-compose.yaml"
          if [ "${{ matrix.stack }}" == "full" ]; then
            COMPOSE_FILE="docker/docker-compose-full.yaml"
          fi
          docker compose -f $COMPOSE_FILE logs > _logs/compose.log 2>&1 || true

      - name: Shutdown Integration Stack (always)
        if: always()
        working-directory: docker
        run: |
          COMPOSE_FILE="docker-compose.yaml"
          if [ "${{ matrix.stack }}" == "full" ]; then
            COMPOSE_FILE="docker-compose-full.yaml"
          fi
          docker compose -f $COMPOSE_FILE down -v || true

      - name: Upload Logs Artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-docker-logs-${{ matrix.stack }}
          path: _logs/compose.log

      - name: Append Job Summary
        if: always()
        run: |
          status="${{ job.status }}"
          driftFlag="${{ steps.drift.outputs.drift }}"
          {
            echo "### .NET 8+10 (${{ matrix.stack }}) Summary";
            echo "- Status: ${status}";
            echo "- Spec ref: ${SPEC_REF}";
            if [ "${driftFlag}" = "true" ]; then
              echo "- Generation Drift: detected";
            else
              echo "- Generation Drift: none";
            fi
            echo "";
          } >> $GITHUB_STEP_SUMMARY
